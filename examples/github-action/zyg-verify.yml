name: zyg verify

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci

      - uses: mindfire-test/zygote@<ref>
        with:
          corpus: recordings
          agent: node agent.js
          passphrase: ${{ secrets.ZYG_PASSPHRASE }}
